<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Ventas</title>

    <link rel="stylesheet" href="css/estilos.css">

    <script src="js/clases.js"></script>
    <script src="js/funciones.js"></script>
</head>

<body>

    <h1>Sistema de Gestión de Ventas</h1>

    <section id="autenticacion">

        <h2>Autenticación</h2>

        <label for="txtUsuario">Usuario</label>
        <input type="text" id="txtUsuario">

        <label for="txtPassword">Contraseña</label>
        <input type="password" id="txtPassword">
        
        <button id="btnRegistrar">Registrarse</button>
        <button id="btnLogin">Iniciar sesión</button>

    </section>

    <p id="mensajeLogin"></p>

    <hr>

    <section id="productos" hidden>

        <h2>Productos</h2>

    </section>

    <hr>

    <section id="ventas" hidden>

        <h2>Ventas</h2>

    </section>
</body>

</html>
